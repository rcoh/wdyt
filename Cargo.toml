[package]
name = "wdyt"
version = "0.2.0"
edition = "2024"
description = "Let coding agents show you their work: a link in Slack, a reply box on the page."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rcoh/wdyt"
keywords = ["cli", "agent", "preview", "notification"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Web framework. Default features are off deliberately: the `asset` and
# `runtime` features serve their browser scripts out of a bundle directory
# produced by the `topcoat` CLI, which would make `cargo install wdyt`
# insufficient to run. Everything here is plain server-rendered HTML plus a
# little hand-written JS, so the binary stays self-contained.
topcoat = { version = "0.5", default-features = false, features = [
    "router",
    "view",
    "serve",
    "discover",
    "compression",
    "tower",
] }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# rustls rather than the system OpenSSL, so `cargo install wdyt` does not
# need native TLS headers present. `rustls-native-certs` reuses the host trust
# store, which matters behind a corporate TLS-inspecting proxy.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "http2",
    "charset",
    "rustls",
    "rustls-native-certs",
    "system-proxy",
] }
directories = "6"
anyhow = "1"

# Syntax highlighting. `syntect-default-onig` is required for the
# `syntect::html` helpers, and the regex engine must match what two-face was
# built against.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
comrak = "0.54"

tower-http = { version = "0.7", features = ["fs"] }
tower = "0.5"
http = "1"
mime_guess = "2"
percent-encoding = "2"
base64 = "=0.23.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
