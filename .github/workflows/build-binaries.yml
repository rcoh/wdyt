# Builds cross-platform binaries and uploads to GitHub Releases.
# Binaries are discoverable by cargo-binstall (https://github.com/cargo-bins/cargo-binstall).
# Called by the release workflow after release-plz publishes a release. It can
# also be dispatched manually to rebuild the binaries for an existing tag.
name: Build Binaries

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.repository_owner == 'rcoh' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p wdyt

      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == "$TAG" ]]; then
            echo "Expected a v* release tag, got: $TAG" >&2
            exit 1
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../wdyt-${{ matrix.target }}-${{ steps.version.outputs.version }}.tar.gz wdyt

      - name: Package (Windows)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path wdyt.exe -DestinationPath ../../../wdyt-${{ matrix.target }}-${{ steps.version.outputs.version }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          files: wdyt-${{ matrix.target }}-${{ steps.version.outputs.version }}.${{ matrix.archive }}
          tag_name: ${{ inputs.tag }}
